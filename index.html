<style>

:root{
  --bg:#eef3f7; --surface:#ffffff; --ink:#12212f; --muted:#576777; --line:#d6dfe7;
  --accent:#c8102e; --accent-ink:#ffffff; --hero:#0f2a43; --hero-ink:#ffffff; --hero-muted:#a9bccd;
  --ok:#17784a; --ok-bg:#dff3e8; --warn:#8a5a00; --warn-bg:#fbefd0; --bad:#a3212f; --bad-bg:#fbe1e4;

  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1621; --surface:#13263a; --ink:#e8eef4; --muted:#9db0c2; --line:#27425d;
  --accent:#ee4560; --accent-ink:#ffffff; --hero:#071019; --hero-ink:#ffffff; --hero-muted:#8fa5b9;
  --ok:#5fd09a; --ok-bg:#12382a; --warn:#f0c15a; --warn-bg:#3a2d0c; --bad:#ff8a97; --bad-bg:#401820;
  --gold:#e0b83a; --silver:#a8b4c0; --bronze:#d08852; --focus:#6aa9f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1621; --surface:#13263a; --ink:#e8eef4; --muted:#9db0c2; --line:#27425d;
  --accent:#ee4560; --accent-ink:#ffffff; --hero:#071019; --hero-ink:#ffffff; --hero-muted:#8fa5b9;
  --ok:#5fd09a; --ok-bg:#12382a; --warn:#f0c15a; --warn-bg:#3a2d0c; --bad:#ff8a97; --bad-bg:#401820;
  --gold:#e0b83a; --silver:#a8b4c0; --bronze:#d08852; --focus:#6aa9f5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{background:var(--hero);color:var(--hero-ink);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);margin:0 0 4px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,52px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--accent)}

nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface)}

.rank-no{font-family:var(--display);font-size:20px;font-weight:700;text-align:center;line-height:1}
.r1{color:var(--gold)}.r2{color:var(--silver)}.r3{color:var(--bronze)}
input[type=text],input[type=number],input[type=datetime-local],select{width:100%;min-width:0;padding:9px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg)}
input:disabled{opacity:.6}
label.field{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label.field input,label.field select{margin-top:4px;color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

details.lb{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}

.pos{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;text-align:center}

.pts small{display:block;font-family:var(--body);font-size:11px;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.name{font-weight:600;overflow-wrap:anywhere}
.prize{font-size:13px;color:var(--ok);font-variant-numeric:tabular-nums}

.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.open{background:var(--warn-bg);color:var(--warn)}
#foot{padding-bottom:48px}
.detail{padding:0 14px 14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hit{color:var(--ok);font-weight:600}.near{color:var(--warn);font-weight:600}.miss{color:var(--muted)}
.res{font-size:13px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
ul.rules{padding-left:18px;margin:6px 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
textarea{width:100%;min-height:150px;border-radius:7px;border:1px solid var(--line);background:var(--bg);padding:8px}
.person{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
@media (prefers-reduced-motion:no-preference){.card,details.lb{transition:border-color .15s}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ---------- Vorgaben (aus der Excel-Vorlage und dem FIS-Programm, Stand 22.10.2026) ---------- */
const DEFAULT_RACES=[
 {id:'tp',name:'Team Parallel',who:'Team',date:'2027-02-01',time:'11:15'},
 {id:'sgd',name:'Super G',who:'Damen',date:'2027-02-04',time:'11:15'},
 {id:'sgh',name:'Super G',who:'Herren',date:'2027-02-05',time:'11:15'},
 {id:'abd',name:'Abfahrt',who:'Damen',date:'2027-02-06',time:'11:15'},
 {id:'abh',name:'Abfahrt',who:'Herren',date:'2027-02-07',time:'11:15'},
 {id:'kd',name:'Team Kombi',who:'Damen',date:'2027-02-09',time:'10:00'},
 {id:'kh',name:'Team Kombi',who:'Herren',date:'2027-02-10',time:'10:00'},
 {id:'rd',name:'Riesenslalom',who:'Damen',date:'2027-02-11',time:'10:00'},
 {id:'rh',name:'Riesenslalom',who:'Herren',date:'2027-02-12',time:'10:00'},
 {id:'sd',name:'Slalom',who:'Damen',date:'2027-02-13',time:'10:00'},
 {id:'sh',name:'Slalom',who:'Herren',date:'2027-02-14',time:'10:00'}
];
const DEFAULTS={deadline:'2027-01-31T20:00',stake:10,payInfo:'',nation:'Schweiz',medalsActual:null,paid:{},races:DEFAULT_RACES.map(r=>({...r,results:['','','']}))};
const PTS={win:5,second:3,third:2,podium:1,full:10,medal:[5,4,3,2,1]};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- Firebase-Zugangsdaten: aus der Firebase-Konsole hier einsetzen (siehe ANLEITUNG.txt) ---------- */
const FIREBASE_CONFIG={
  apiKey:'AIzaSyDXIacFMlhGIZ7j_7BeIRZcjjE_ZLR2azQ',
  authDomain:'ski-wm-tippspiel.firebaseapp.com',
  databaseURL:'https://ski-wm-tippspiel-default-rtdb.europe-west1.firebasedatabase.app',
  projectId:'ski-wm-tippspiel',
  appId:'1:478931585715:web:bb8130c0a3866184373ec6'
};
let admFirst=null, admSecond=null, admLoaded={}, zugOpen=false, invite=null, invAttached=false, autoRes={}, meta=null;
let db=null, me={uid:null,admin:false}, cfgRemote=null, tips={}, players={}, tipsAll={}, tipsOwn=null, view='rang', target=null;
let loaded={cfg:false,tips:false,admin:false}, dbError=null, setupMissing=false, tipsAttached=false, openSet=new Set(), saveTimer=null, chain=Promise.resolve();

const rawCfg=()=>{const c=Object.assign({},DEFAULTS,cfgRemote||{}); c.paid=c.paid||{}; c.races=(cfgRemote&&cfgRemote.races)||DEFAULTS.races; return c};
/* Manuelle Eingabe: pro Feld ein Name; bei Gleichstand mehrere Namen mit « / » trennen */
const parseManual=man=>{const rows=[];man.slice(0,3).forEach((cell,i)=>String(cell||'').split('/').map(s=>s.trim()).filter(Boolean).forEach(n=>rows.push({name:n,rank:i+1,nat:''})));return rows};
/* Bei Gleichstand belegen die gleichplatzierten Fahrer gemeinsam die Plätze (z. B. zwei Sieger: Platz 1 und 2) */
function addSlots(rows){
  const out=rows.map(r=>Object.assign({},r)),by={};let before=0;
  out.forEach(r=>{(by[r.rank]=by[r.rank]||[]).push(r)});
  Object.keys(by).map(Number).sort((a,b)=>a-b).forEach(rk=>{const g=by[rk],s=g.map((_,k)=>before+1+k);g.forEach(r=>{r.slots=s});before+=g.length});
  return out;
}
const resLines=(r,sep)=>r.rows.map(x=>x.rank+'. '+esc(x.name)).join(sep);
/* Anzeige-Konfiguration: manuelle Resultate haben Vorrang, sonst gelten die FIS-Resultate */
const cfg=()=>{
  const c=rawCfg();
  c.races=c.races.map(r=>{
    const man=r.results||['','',''];let rows=null,src='';
    const mrows=parseManual(man);
    if(mrows.length>=3&&norm(man[0])){rows=mrows;src='manuell'}
    else if(autoRes[r.id]&&autoRes[r.id].rows){rows=autoRes[r.id].rows;src='FIS'}
    if(rows)rows=addSlots(rows);
    return Object.assign({},r,{manual:man,rows,src,results:rows?rows.slice(0,3).map(x=>x.name):['','','']});
  });
  c.medalsRaw=c.medalsActual;
  if(c.medalsActual==null&&meta&&meta.complete&&meta.medals){c.medalsActual=meta.medals[canonNat(c.nation)]||0}
  return c;
};
const deadlineMs=()=>Date.parse(cfg().deadline);
const closed=()=>Date.now()>deadlineMs();
const fmtDate=(d,t)=>{const x=new Date(d+'T12:00:00');return WD[x.getDay()]+' '+String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+(t?' · '+t:'')};
const fmtDT=s=>{const x=new Date(s);return WD[x.getDay()]+' '+x.toLocaleDateString('de-CH')+', '+x.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})+' Uhr'};
const chf=n=>'CHF '+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'.–');

/* ---------- Wertung ---------- */
function norm(s){return (s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const NATS={SUI:['Schweiz','switzerland','suisse','svizzera','ch'],AUT:['Österreich','austria','at'],GER:['Deutschland','germany','de'],ITA:['Italien','italy','italia','it'],FRA:['Frankreich','france','fr'],USA:['USA','united states of america','united states','vereinigte staaten','amerika','us'],NOR:['Norwegen','norway'],SWE:['Schweden','sweden'],CAN:['Kanada','canada'],SLO:['Slowenien','slovenia'],CRO:['Kroatien','croatia'],FIN:['Finnland','finland'],CZE:['Tschechien','czech republic','czechia'],SVK:['Slowakei','slovakia'],BEL:['Belgien','belgium'],NED:['Niederlande','netherlands','holland'],GBR:['Grossbritannien','great britain','england'],JPN:['Japan'],AUS:['Australien','australia'],NZL:['Neuseeland','new zealand'],ESP:['Spanien','spain'],AND:['Andorra'],LIE:['Liechtenstein'],POL:['Polen','poland'],BUL:['Bulgarien','bulgaria'],ROU:['Rumänien','romania'],HUN:['Ungarn','hungary'],UKR:['Ukraine'],CHI:['Chile'],ARG:['Argentinien','argentina'],BRA:['Brasilien','brazil'],KOR:['Südkorea','south korea','korea'],CHN:['China'],LAT:['Lettland','latvia'],EST:['Estland','estonia'],LTU:['Litauen','lithuania'],TUR:['Türkei','turkey'],GRE:['Griechenland','greece'],DEN:['Dänemark','denmark'],ISL:['Island','iceland']};
const NAT_IDX={};Object.entries(NATS).forEach(([c,l])=>{NAT_IDX[norm(c)]=c;l.forEach(n=>{NAT_IDX[norm(n)]=c})});
const canonNat=s=>NAT_IDX[norm(s)]||null;
function lev1(a,b){if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;if(a.length===b.length)return a.slice(i+1)===b.slice(i+1);return a.length>b.length?a.slice(i+1)===b.slice(i):b.slice(i+1)===a.slice(i)}
const tokEq=(p,q)=>p===q||(p.length>=6&&q.length>=6&&lev1(p,q));
function same(a,b){
  const na=norm(a),nb=norm(b);if(!na||!nb)return false;if(na===nb)return true;
  const ca=NAT_IDX[na],cb=NAT_IDX[nb];if(ca||cb)return ca===cb;
  const x=na.split(' '),y=nb.split(' ');
  const suf=(s,l)=>s.length<=l.length&&s.every((t,i)=>tokEq(t,l[l.length-s.length+i]));
  if(suf(x,y)||suf(y,x))return true;
  const ini=(s,l)=>s.length>=2&&l.length>=2&&s[0].length===1&&l[0][0]===s[0]&&suf(s.slice(1),l.slice(1));
  return ini(x,y)||ini(y,x);
}
function hasResult(r){return !!(r.rows&&r.rows.length>=3)}
function scoreRace(pick,r){
  const p=pick||['','',''],rows=r.rows;let pts=0;const marks=[];
  for(let i=0;i<3;i++){
    if(rows.some(x=>x.rank===i+1&&same(p[i],x.name))){pts+=[PTS.win,PTS.second,PTS.third][i];marks.push('hit')}
    else if(rows.some(x=>same(p[i],x.name))){pts+=PTS.podium;marks.push('near')}
    else marks.push('miss');
  }
  const full=marks.every(m=>m==='hit'); /* ganzes Podest richtig = 5+3+2 = 10 Punkte, kein Zusatzbonus */
  return {pts,marks,full};
}
const fmtP=n=>Number.isInteger(n)?String(n):(Math.round(n*10)/10).toString().replace('.',',');
function scoreMedals(m,actual){if(m==null||actual==null)return 0;const d=Math.abs(m-actual);return PTS.medal[d]||0}
function scorePerson(t,c){
  const rows=[];let total=0;
  c.races.forEach(r=>{if(!hasResult(r))return;const s=scoreRace(t.picks&&t.picks[r.id],r);total+=s.pts;rows.push({r,s})});
  const mp=0; /* Medaillen-Punkte werden in leaderboard() nach Nähe unter allen Tippenden vergeben */
  return {total,rows,mp};
}
function leaderboard(){
  const c=cfg();
  const list=Object.entries(tips).filter(([id,t])=>t&&t.name).map(([id,t])=>({id,t,...scorePerson(t,c)}));
  /* Medaillen-Frage: Wer am nächsten am Ergebnis liegt, bekommt 5, dann 4, 3, 2, 1. Bei gleicher Abweichung wird geteilt. */
  if(c.medalsActual!=null){
    const cand=list.filter(p=>p.t.medals!=null&&p.t.medals!=='').map(p=>({p,d:Math.abs(Number(p.t.medals)-c.medalsActual)})).sort((a,b)=>a.d-b.d);
    let i=0;
    while(i<cand.length){
      let j=i;while(j+1<cand.length&&cand[j+1].d===cand[i].d)j++;
      let sum=0;for(let k=i;k<=j;k++)if(k<PTS.medal.length)sum+=PTS.medal[k];
      const each=Math.round(sum/(j-i+1)*100)/100;
      for(let k=i;k<=j;k++){cand[k].p.mp=each;cand[k].p.total+=each}
      i=j+1;
    }
  }
  list.sort((a,b)=>b.total-a.total||a.t.name.localeCompare(b.t.name,'de'));
  const paidN=list.filter(p=>c.paid[p.id]).length, pot=paidN*Number(c.stake||0);
  const shares=[1/2,1/3,1/6];
  let i=0;
  while(i<list.length){
    let j=i;while(j+1<list.length&&list[j+1].total===list[i].total)j++;
    const g=j-i+1;let sum=0;for(let k=i;k<=j;k++)if(k<3)sum+=shares[k];
    for(let k=i;k<=j;k++){list[k].rank=i+1;list[k].prize=pot*sum/g}
    i=j+1;
  }
  const done=c.races.filter(hasResult).length;
  return {list,pot,paidN,done,total:c.races.length};
}
const revealed=id=>closed()||me.admin||id===me.uid;

/* ---------- Anzeige ---------- */
const TABS=()=>[['rang','Rangliste'],['tipp','Meine Tipps'],['rennen','Rennen'],['regeln','Reglement']].concat(me.admin?[['admin','Verwaltung']]:[]);
function renderTabs(){
  $('#tabs').innerHTML=TABS().map(([k,l])=>`<button role="tab" data-v="${k}" aria-selected="${view===k}">${l}</button>`).join('');
}
function renderStatus(){
  const c=cfg(),lb=leaderboard();let t;
  const ms=deadlineMs()-Date.now();
  if(ms>0){const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);t=`Tippschluss in <b>${d} Tg ${h} Std ${m} Min</b>`}
  else t='<b>Tipps geschlossen</b>';
  $('#status').innerHTML=`<span>${t}</span><span>Teilnehmer <b>${lb.list.length}</b></span><span>Pot <b>${chf(lb.pot)}</b></span><span>Gewertet <b>${lb.done}/${lb.total}</b> Rennen</span>`;
}
function infoNotes(){
  let h='';
  if(setupMissing)h+='<div class="note bad">Die Datenbank ist noch nicht verbunden. Bitte die Firebase-Zugangsdaten eintragen (siehe ANLEITUNG.txt).</div>';
  else if(dbError)h+=`<div class="note bad">Verbindung zur Datenbank gestört (${esc(dbError)}). Seite neu laden.</div>`;
  else if(db&&!(loaded.cfg&&loaded.tips&&loaded.admin))h+='<div class="note">Daten werden geladen …</div>';
  return h;
}
function renderRang(){
  const el=$('#p-rang'),c=cfg(),lb=leaderboard();
  let h=infoNotes()+'<h2>Rangliste</h2>';
  if(!lb.list.length){h+='<div class="empty">Noch keine Tipps. Unter «Meine Tipps» den Namen eintragen und loslegen.</div>';el.innerHTML=h;return}
  if(!lb.done)h+='<p class="muted">Sobald das erste Rennen gewertet ist, erscheinen hier die Punkte.</p>';

      const pick=(p.t.picks&&p.t.picks[r.id])||['','',''];

      const resHtml=hasResult(r)?resLines(r,'<br>'):'<span class="muted">offen</span>';

    }).join('');
    const med=`<tr><td>Medaillen ${esc(c.nation)}</td><td>${show?(p.t.medals==null?'–':esc(p.t.medals)):'<span class="muted">verdeckt</span>'}</td><td>${c.medalsActual==null?'<span class="muted">offen</span>':esc(c.medalsActual)}</td><td class="n">${c.medalsActual==null?'–':'+'+fmtP(p.mp)}</td></tr>`;
    const cls=p.rank<=3&&lb.done?' r'+p.rank:'';
    h+=`<details class="lb" data-id="${esc(p.id)}"${openSet.has(p.id)?' open':''}><summary>
      <div class="pos${cls}">${p.rank}</div>
      <div><div class="name">${esc(p.t.name)}${p.id===me.uid?' <span class="tag">du</span>':''}</div>
      <div class="paid"><span class="chip ${c.paid[p.id]?'ok':'open'}">${c.paid[p.id]?'bezahlt':'Einsatz offen'}</span>${lb.done&&p.prize>0?` · <span class="prize">Gewinn ${chf(p.prize)}</span>`:''}</div></div>
      <div class="pts">${fmtP(p.total)}<small>Punkte</small></div></summary>
      <div class="detail"><table><thead><tr><th>Rennen</th><th>Tipp</th><th>Resultat</th><th>Pkt</th></tr></thead><tbody>${rows}${med}</tbody></table>
      ${show?'':'<p class="muted" style="margin:8px 0 0">Die Tipps der anderen werden nach Tippschluss sichtbar.</p>'}</div></details>`;
  });
  h+=`<p class="muted" style="font-size:13px">Auszahlung: ${chf(lb.pot)} im Pot (${lb.paidN} bezahlte Einsätze). Sieger 1/2, Platz 2 ein Drittel, Platz 3 ein Sechstel. Bei Punktgleichheit wird geteilt. ★ = ganzes Podest in der richtigen Reihenfolge.</p>`;
  el.innerHTML=h;
}

}function fillAthletes(){
  const set=new Map();

  Object.values(tips).forEach(t=>t&&t.picks&&Object.values(t.picks).forEach(a=>(a||[]).forEach(add)));

  $('#athletes').innerHTML=[...set.values()].sort((a,b)=>a.localeCompare(b,'de')).map(x=>`<option value="${esc(x)}">`).join('');
}

/* ---------- Schreiben ---------- */
const queue=fn=>{chain=chain.then(fn).catch(e=>{console.warn(e)});return chain};
function setState(id,msg,bad){const e=$('#'+id);if(e){e.textContent=msg;e.style.color=bad?'var(--bad)':''}}
async function saveTip(tid,patch,stateId){
  if(!db)return;
  try{
    if(patch.name!==undefined)await db.ref('players/'+tid).set({name:patch.name});
    if(patch.picks!==undefined)await db.ref('tips/'+tid).set({picks:patch.picks,medals:patch.medals==null?null:patch.medals,updated:Date.now()});
    setState(stateId,'Gespeichert')
  }catch(e){setState(stateId,e&&e.code==='PERMISSION_DENIED'?'Nicht erlaubt (Tippschluss vorbei?)':'Speichern nicht möglich',true)}
}
function collectTip(){
  const picks={};cfg().races.forEach(r=>{picks[r.id]=[0,1,2].map(i=>($(`#t-${r.id}-${i}`)||{value:''}).value.trim())});
  const m=$('#t-medals');return {picks,medals:m&&m.value!==''?Number(m.value):null};
}
function scheduleSave(){
  const tid=target||me.uid;setState('savestate','Speichert …');clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>queue(()=>saveTip(tid,collectTip(),'savestate')),700);
}
function saveCfg(next,stateId){return queue(async()=>{try{next.deadlineMs=Date.parse(next.deadline);await db.ref('config').set(next);setState(stateId,'Gespeichert')}catch(e){setState(stateId,'Speichern nicht möglich',true)}})}
function collectCfg(){
  const c=rawCfg();const next={payInfo:$('#a-pay').value.trim(),deadline:$('#a-deadline').value||c.deadline,stake:Number($('#a-stake').value)||0,nation:$('#a-nation').value.trim()||'Schweiz',medalsActual:$('#a-medals').value===''?null:Number($('#a-medals').value),paid:c.paid};
  next.races=c.races.map(r=>({id:r.id,name:r.name,who:r.who,date:$(`#a-${r.id}-date`).value.trim()||r.date,time:$(`#a-${r.id}-time`).value.trim(),results:[0,1,2].map(i=>$(`#a-${r.id}-${i}`).value.trim())}));
  return next;
}

}
(async()=>{
  const bad=!window.firebase||Object.values(FIREBASE_CONFIG).some(v=>!v||v==='HIER_EINTRAGEN');
  if(bad){setupMissing=true;renderAll();return}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const cred=await firebase.auth().signInAnonymously();me.uid=cred.user.uid;
    db=firebase.database();
  }catch(e){dbError=(e&&e.code)||'Anmeldung';renderAll();return}
  const err=e=>{dbError=(e&&e.code)||'Fehler';renderAll()};
  const admUpd=()=>{
    me.admin=admFirst===me.uid||admSecond===me.uid;
    if(admLoaded.f&&admLoaded.s)loaded.admin=true;
    if(me.admin&&!invAttached){invAttached=true;db.ref('adminInvite').on('value',x=>{invite=x.val();renderAdmin()},()=>{})}
    attachTips();renderAll()};
  db.ref('admin/first').on('value',s=>{admFirst=s.val();admLoaded.f=true;admUpd()},err);
  db.ref('admin/devices/'+me.uid).on('value',s=>{admSecond=s.exists()?me.uid:null;admLoaded.s=true;admUpd()},err);
  db.ref('config').on('value',s=>{cfgRemote=s.val();loaded.cfg=true;fillAthletes();attachTips();renderAll()},err);
  db.ref('players').on('value',s=>{players=s.val()||{};loaded.tips=true;rebuild()},err);
  db.ref('results').on('value',s=>{autoRes=s.val()||{};renderAll()},()=>{});
  db.ref('meta').on('value',s=>{meta=s.val();renderAll()},()=>{});
  db.ref('tips/'+me.uid).on('value',s=>{tipsOwn=s.val();rebuild()},()=>{});
  setInterval(attachTips,30000);
  setTimeout(()=>{if(!(loaded.cfg&&loaded.tips&&loaded.admin)){dbError='keine Antwort';renderAll()}},10000);
})();
</script>
